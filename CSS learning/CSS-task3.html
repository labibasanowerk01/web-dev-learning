<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Task 3</title>
    <style>
        * {
            margin: 0;
            padding: 0;
        }
        body {
            position: relative;
            background-color: black;
        }
        header {
            position: sticky;
            top: 0;
        }
    .navbar {
        background-color: rgb(255, 107, 255);
        width: 100vw;
        height: 7vh;
    }
    .container {
        background-color: green;
        height: 70vh;
        width: 90vw;
        margin: 20px;
        margin-top: 80px;
        padding: 50px;
        display: flex;
        justify-content: center;
        align-items: center;
    }
    .container span {
        display: inline-flex;
        background-color: cyan;
        height: 35em;
        width: 35em;
        margin: 60px;
    }
    span:first-child {
        background-color: salmon;
    }
    .sec2 {
        display: flex;
        justify-content: center;
    }
    .sec2 img {
    height: 50px;
    width: 50px;
    right: 23px;
    position: fixed;
    bottom: 23px;
    border-radius: 60px;
    }
    .box {
        border: 2px solid white;
        border-radius: 50px;
        height: 20vh;
        width: 65vw;
        margin: 50px;
        margin-top: 0px;
        padding: 60px;
        text-align: center;
    }
    .box p {
        color: white;
        margin-top: 15px;
        font-size: 4rem;
    }
    .footer {
         width: 100vw;
        height: 7vh;
        background-color: rgb(242, 238, 214);
    }

    </style>
</head>

<body>
    <header>
      <div class="navbar">

    </div>
    </header>
    <div class="container">
        <span>

        </span>
        <span>

        </span>
    </div>
    <div class="sec2">
        <img src="https://img.magnific.com/free-vector/luxury-gold-brand-guarantee-label-collection_32991-599.jpg?semt=ais_hybrid&w=740&q=80" alt="">
        <div class="box">
            <p>Lorem ipsum dolor, sit amet consectetur adipisicing elit.</p>
        </div>
    </div>
    <div class="footer">

    </div>

</body>

</html>
