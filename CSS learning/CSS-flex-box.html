<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Flex Box</title>
    <style>
        .container {
            height: 80vh;
            border: 2px solid greenyellow;
            display: flex;
            /* justify-content: center; */
            align-items: center;
            /* flex-direction: column; */
            /* flex-direction: column-reverse; */

            flex-flow: row wrap;
