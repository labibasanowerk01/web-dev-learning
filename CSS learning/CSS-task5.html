<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Task 5-Ultra Edit body</title>
    <style>
         @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@100;400;600&display=swap');
        * {
            margin: 0;
            padding: 0;
        }
        
        main {
            display: flex;
             justify-content: center;
        }

        .top {
            height: 25vh;
            width: 60vw;
            padding: 8px;
            margin: 3rem;
            text-align: center;
            transform: translateY(30%);
            font-family: 'Poppins', sans-serif;
            position: relative;
        }
        .top h1 {
            margin: 25px;
            font-weight: 400;
        }
        .top p {
            margin: 25px;
            color: grey;
        }
        .top button {
            padding: 20px;
            color: white;
            background-color: rgb(92, 209, 255);
            border: none;
            border-radius: 5px;
            height: 1.5vh;
            display: flex;
            align-items: center;
            position: absolute;
            left: 35%;
            font-weight: 400;
        }
        .card {
            height: 3rem;
            width: 2rem;
        }
    </style>
</head>

<body>
    <main>
        <div class="top">
            <h1>Download <strong>UltraEdit</strong> for Windows</h1>
            <p>Download and try UltraEdit before you buy it! This download includes the full Windows version of the text
                editor.</p>
            <button>DOWNLOAD MAC OR LINUX VERSION</button>
        </div>
    <div class="body">
        <div class="card">
            <h2>English</h2>
            <button class="lang">Download 32-bit</button>
            <button class="lang-2">Download 64-bit</button>
        </div>
    </main>
</body>

</html>
