<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Card design</title>
    <style>
        * {
            margin: 0;
            padding: 0;
        }

        body {
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 100px;

        }

        .box {
            border: none;
            box-shadow: 0px 0px 8px 3px rgba(0, 0, 0, 0.133);
            border-radius: 8px;
            width: 300px;
            height: 530px;
            padding: 10px;
            position: relative;
        }

        .box img {
            border-radius: 8px;
            width: 300px;
            height: 305px;
        }

        .box span {
            border: 1px solid gray;
            border-radius: 15px;
            display: inline-flex;
            justify-content: center;
            margin: 10px 0px 5px 5px;
            padding: 3px;
            font-size: 14px;
            color: gray;

        }

        .tag-1 {
            height: 18px;
            width: 45px;
        }

        .tag-2 {
            height: 18px;
            width: 40px;
        }

        .card-heading {
            margin: 15px;
        }

        .desc {
            margin: 1rem;
            color: gray;
        }

        .btn {
            display: flex;
            justify-content: center;
        }
       
        .rd-btn {
            position: absolute;
            bottom: 15px;
            padding: 13px;
            border-radius: 20px;
            border: none;
            color: blue;
            background-color: rgba(0, 123, 255, 0.151);
            height: 40px;
            width: 110px;
            cursor: pointer;
        }
    .rd-btn:hover {
        background-color: rgba(0, 123, 255, 0.215);
    }
    .rd-btn:active {
        background-color: blue;
        color: white;
    }
    </style>
</head>

<body>
    <div class="box">
        <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQxgpm9zFTcd1POkSPizwGIxq5NmZbbaLHrTydGUEEEyw&s=10"
            alt="Waterfall view">
        <span class="tag-1">
            Nature
        </span>
        <span class="tag-2">
            Lake
        </span>
        <h2 class="card-heading">Lorem, ipsum.</h2>
        <p class="desc">Lorem ipsum dolor sit amet consectetur adipisicing elit. Maiores quos, tempora voluptas
            assumenda aliquam aut?</p>
        <div class="btn">
                <button class="rd-btn">Read more</button>
        </div>
    </div>
</body>

</html>
