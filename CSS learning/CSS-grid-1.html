<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Grid 1</title>
    <style>
        .container {
            border: 2px solid black;
            display: grid;
            grid-template-columns: [fir-line] 120px [sec-line] 100px [thir-line];
            grid-template-rows: 100px 100px 100px;
        }

        .item {
            border: 2px solid green;
            height: 80px;
            width: 80px;
        }

        .item-1 {
            grid-column: 1/2;
            grid-row: 1/2;
        }

        .item-4 {
            grid-column: fir-line/thir-line;
            grid-row: 1/2;
            /* or you can do */
            /* grid-row-start: 1;
            grid-row-end: 2;
            grid-column-start: 1;
            grid-column-end: 2; */
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="item item-1">1</div>
        <div class="item">2</div>
        <div class="item">3</div>
        <div class="item item-4">4</div>
        <div class="item">5</div>
    </div>
</body>

</html>
