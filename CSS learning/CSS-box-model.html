<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Box Model</title>
    <style>
        * {
            margin: 0;
            padding: 0;
        }

        .box {
            width: 80vw;
            height: 433px;
            border: 2px solid black;
            margin: 20px;
        }

        .box-1 {
            background-color: red;
            position: absolute;
            top: 0; 
            left: 122px; 
        }

        .box-2 {
            background-color: blue;
           /* position: fixed;
            top: 0;
            left: 0;
            height: 100px;  */
        }

        .box-3 {
            background-color: green;
            /* position: sticky;
            bottom: 25px;
            left: 0;
            height: 100px; */ */
        }

        .box-4 {
            background-color: yellow;
        }
        .parent {
            margin: 45px;
            padding: 34px;
            border: 2px solid purple;
             /* position: absolute; */
             /* transform: translate(0px);
             filter: invert(0); */
             /* Exception: transform, filter, or perspective properties can also make an element appear as positioned */
            /* transform: translate(0); */
            /* filter: invert(0); */
            /* perspective: 0em; */
        }
    </style>
</head>

<body>
    <div class="parent">
        <div class="box box-1">
        </div>
        <div class="box box-2">
        </div>
        <div class="box box-3">
        </div>
        <div class="box box-4">
        </div>
    </div>


</body>

</html>
