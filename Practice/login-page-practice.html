<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Page-HTML and CSS</title>
    <link rel="stylesheet" href="login-page-practice.CSS">
</head>

<body>
    <div class="container">
        <div class="sec-1">
            <form action="" method="post">
            <h2>Login</h2>
            <div class="username-email">
                <label for="username-email"></label>
                <input class="box" type="text email" placeholder="Enter your Username or Email">
            </div>
            <div class="password">
                <label for="password"></label>
                <input class="box" type="password" placeholder="Password">
            </div>
            <p>Don't have an account? <a href="#">Sign up</a></p>
        </div>
        <div class="sec-2">
            <div class="btn-1">
                <button type="submit" class="btn login">Login</button>
            </div>
            <div class="btn-2"> 
                <a class="btn sign-up" href="#">Sign up</a>
            </div>
        </div>
        </form>
</body>

</html>
