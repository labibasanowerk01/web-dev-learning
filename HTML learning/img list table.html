<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="img list table.css">
</head>

<body>
    <img src="image.png" alt="Windows homescreen image" width="500" height="300"> <br>

    <table>
       <caption>Broski table</caption>
        <thead>
            <tr>
                <th>Name</th>
                <th >Grade</th>
            </tr>
        </thead>

        <tbody>
            <tr>
                <td colspan="2">Labiba</td>
                <td>-2</td>
            </tr>
            <tr>
                <td>Samiha</td>
                <td rowspan="2">-2.5</td>
            </tr>
            <tr>
                <td>Nissa</td>
            </tr>
        </tbody>
        <tfoot>
              <tr>
                <td>Ilora</td>
                <td>-3</td>
            </tr>
        </tfoot> 
    </table>

    <ul type="square">
        <li>Item 1</li>
        <li>Item 2</li>
        <li>Item 3</li>
    </ul>

    <ol type="I">
        <li>Item 1</li>
        <li>Item 2</li>
        <li>Item 3</li>
    </ol>
</body>
</html>
