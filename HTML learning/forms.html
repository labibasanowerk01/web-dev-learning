<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Learning about forms</title>
  </head>

  <body>
    <h1>Fotka gang joining form</h1>

    <div>
      <form action="POST">
        <label for="name">Name:</label>
        <input
          type="text"
          id="name"
          name="name"
          placeholder="Enter your name"
          required
          autofocus
        /><br /><br />

        <label for="class">Class:</label>
        <input
          type="number"
          id="class"
          name="class"
          min="6"
          placeholder="Enter your class"
          required
        /><br /><br />

        <label for="age">Age:</label>
        <input
          type="number"
          id="age"
          name="age"
          min="13"
          placeholder="Enter your age"
          required
        /><br /><br />

        <h2>Select your gender:</h2>
        <div>
          <label for="male" style="cursor: pointer">Male</label>
          <input
            type="radio"
            id="male"
            name="gender"
            value="male"
            required
            style="cursor: pointer"
          />
          <label for="female" style="cursor: pointer">Female</label>
          <input
            type="radio"
            id="female"
            name="gender"
            value="female"
            required
            style="cursor: pointer"
          />
          <label for="other" style="cursor: pointer">Other</label>
          <input
            type="radio"
            id="other"
            name="gender"
            value="other"
            required
            style="cursor: pointer"
          /><br /><br />
        </div>
        <h2>Select your role in the gang:</h2>
        <select name="role" id="role" required style="cursor: pointer">
          <option value="chadabaz">chadabaz</option>
          <option value="bully">bully</option>
          <option value="miska shoytan">miska shoytan</option>
          <option value="side character" selected>side character</option>
        </select>
        <div>
          <h2>Select your Fotka types:</h2>
          <label for="viewer">Viewer Fotka</label>
          <input
            type="checkbox"
            id="viewer"
            name="mode"
            value="Viewer"
            style="cursor: pointer"
            checked
          /><br /><br />
          <label for="action">Action Fotka</label>
          <input
            type="checkbox"
            id="action"
            name="mode"
            value="Action"
            style="cursor: pointer"
          /><br /><br />
        </div>

        <label for="description">Tell us about yourself:</label><br />
        <br />
        <textarea
          id="description"
          name="description"
          rows="4"
          cols="50"
          placeholder="Enter a brief description about yourself"
        ></textarea
        ><br /><br />

        <input type="submit" value="Submit" />
      </form>
    </div>
  </body>
</html>
